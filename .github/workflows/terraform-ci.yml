name: Terraform CI

# Runs automatically on every push and every pull request that touches
# the infrastructure code. Read-only: it only validates and plans, it
# never runs `terraform apply`, so it can never change or cost anything
# in AWS by itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-check:
    name: Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_allowed_ssh_cidr: ${{ secrets.TF_VAR_ALLOWED_SSH_CIDR }}

      - name: Format check result
        if: steps.fmt.outcome == 'failure'
        run: echo "::warning::terraform fmt found formatting issues. Run 'terraform fmt' locally and commit the result."